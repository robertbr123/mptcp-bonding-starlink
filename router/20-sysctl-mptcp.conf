# router/20-sysctl-mptcp.conf -> /etc/sysctl.d/90-mptcp.conf
# MPTCP ligado + forwarding + ajustes para mesmo-subnet em várias placas.
net.mptcp.enabled = 1
net.ipv4.ip_forward = 1
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2
net.ipv4.conf.all.arp_filter = 1
net.ipv4.conf.all.arp_ignore = 1
net.ipv4.conf.all.arp_announce = 2
# fila inteligente (controla bufferbloat / latencia sob carga)
net.core.default_qdisc = fq_codel
# DESLIGA IPv6: o tunel/NAT e so IPv4. Sem isso, nomes com AAAA (ex google.com)
# resolvem pra IPv6 e falham (nao ha caminho IPv6 pelo tunel). Tudo por IPv4.
net.ipv6.conf.all.disable_ipv6 = 1
net.ipv6.conf.default.disable_ipv6 = 1
net.ipv6.conf.lo.disable_ipv6 = 0
